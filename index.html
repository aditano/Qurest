<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Qurest — Symptom interview</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b3f3b'/%3E%3Crect x='58' width='6' height='64' fill='%23dff25a'/%3E%3Ctext x='30' y='46' text-anchor='middle' font-family='Georgia,serif' font-size='40' font-weight='700' fill='%23f4f7f2'%3EQ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,500;0,700;1,500;1,700&family=Karla:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --paper:#e4efe8;
      --sheet:#f7faf6;
      --ink:#14221c;
      --ink-soft:#3d5248;
      --rule:#c5d5cc;
      --rule-strong:#8aa898;
      --teal:#0e6b62;
      --teal-deep:#0b3f3b;
      --mark:#dff25a;
      --alert:#8e241c;
      --alert-wash:#fdecea;
      --spine:16px;
    }
    html{color-scheme:light}
    body{
      min-height:100vh;color:var(--ink);
      font-family:Karla,"Avenir Next","Segoe UI",sans-serif;
      background:var(--paper);
      font-size:17px;line-height:1.5;
      padding-left:var(--spine);
      -webkit-font-smoothing:antialiased;
    }
    ::selection{background:var(--mark);color:var(--ink)}
    .spine{
      position:fixed;left:0;top:0;bottom:0;width:var(--spine);z-index:40;
      background:linear-gradient(var(--mark),var(--mark)) right/3px 100% no-repeat,var(--teal-deep);
    }
    .skip{
      position:absolute;left:-999px;top:0;
    }
    .skip:focus{
      left:calc(var(--spine) + .8rem);top:.8rem;z-index:50;
      background:var(--mark);color:var(--ink);padding:.45rem .7rem;text-decoration:none;
    }
    .masthead{
      display:flex;align-items:flex-end;justify-content:space-between;gap:1.25rem;
      padding:1.15rem 1.5rem .9rem 1.6rem;
      border-bottom:3px solid var(--ink);
      box-shadow:0 1px 0 var(--teal);
    }
    .form-code{
      font-weight:700;font-size:.78rem;letter-spacing:.14em;
      color:var(--teal);margin-bottom:.15rem;
    }
    h1{
      font-family:Besley,Georgia,"Iowan Old Style",serif;
      font-weight:700;font-size:clamp(2.5rem,5vw,3.7rem);
      line-height:.84;letter-spacing:-.03em;
    }
    .masthead-sub{
      margin-top:.45rem;font-size:1.02rem;color:var(--ink-soft);max-width:36rem;
    }
    .stamp{
      flex-shrink:0;border:2px solid var(--alert);color:var(--alert);
      font-family:Besley,Georgia,serif;font-style:italic;font-weight:700;
      font-size:1rem;line-height:1.15;text-align:center;
      padding:.4rem .7rem .45rem;min-width:7.5rem;
      transform:rotate(-1.5deg);
    }
    body[data-screen="emergency"] .stamp{
      background:var(--alert);color:#fff8f6;transform:none;
    }
    .container{max-width:1080px;margin:0 auto;padding:1.15rem 1.4rem 2.5rem}
    .preface{
      max-width:68ch;margin:0 0 1.35rem;color:var(--ink-soft);font-size:.98rem;
    }
    .preface span{
      font-family:Besley,Georgia,serif;font-style:italic;font-weight:700;
      color:var(--ink);margin-right:.25rem;
    }
    .workspace{
      display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:1.6rem;align-items:start;
    }
    .console{
      background:var(--sheet);border-left:8px solid var(--teal);min-width:0;
    }
    .console:has(.emergency-screen){
      border-left-color:var(--alert);background:#fff8f6;
    }
    .console-head{padding:1.3rem 1.35rem 1.05rem}
    .kicker-row{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;margin-bottom:.7rem}
    .kicker{
      display:inline-block;font-family:Besley,Georgia,serif;font-style:italic;font-weight:500;
      font-size:1.02rem;letter-spacing:0;text-transform:none;color:var(--ink);
      background:var(--mark);padding:.02rem .42rem .12rem;
    }
    .kicker-of{font-size:.92rem;color:var(--ink-soft)}
    .console-title{
      font-family:Besley,Georgia,serif;font-weight:700;
      font-size:clamp(1.5rem,2.5vw,2.05rem);line-height:1.16;letter-spacing:-.02em;
    }
    .console-copy{color:var(--ink-soft);font-size:1.02rem;line-height:1.45;margin-top:.55rem}
    .progress-chip{margin-top:1rem}
    .progress-bar{height:7px;background:#d5e3db;overflow:hidden}
    .progress-fill{height:100%;background:var(--teal);transition:width .25s ease}
    .choice-grid{display:flex;flex-direction:column;padding:0 1.15rem .4rem}
    .opt{
      display:flex;align-items:flex-start;gap:.85rem;padding:.85rem .25rem;
      border:none;border-bottom:1px solid var(--rule);cursor:pointer;text-align:left;width:100%;
      background:transparent;color:var(--ink);font-size:1.02rem;line-height:1.4;
    }
    .opt:hover{background:#eef5f1}
    .opt.selected{background:#e7f4a4}
    .opt-marker{
      width:1.7rem;height:1.7rem;border:1.5px solid var(--ink);
      display:grid;place-items:center;flex-shrink:0;margin-top:.05rem;
      font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums;
    }
    .opt.selected .opt-marker{background:var(--ink);color:var(--mark)}
    .opt strong{font-weight:500;display:block}
    .opt.selected strong{font-weight:700}
    .opt small{display:block;color:var(--ink-soft);font-size:.9rem;margin-top:.15rem;line-height:1.35}
    .opt>span:last-child{min-width:0;flex:1}
    .composer{border-top:1px solid var(--rule);padding:.95rem 1.35rem 1.1rem;background:var(--sheet)}
    .key-hint{font-size:.86rem;color:var(--ink-soft);margin-bottom:.7rem}
    .composer-actions{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
    .action-left,.action-right{display:flex;align-items:center;gap:.9rem}
    button{font:inherit;color:inherit}
    .btn-primary,.btn-next,.btn-restart{
      border:none;border-radius:0;cursor:pointer;font-size:1rem;font-weight:700;
      background:var(--teal);color:#f4faf7;padding:.72rem 1.15rem;
    }
    .btn-primary:hover:not(:disabled),.btn-next:hover:not(:disabled),.btn-restart:hover{background:#0a524c}
    .btn-secondary,.btn-back{
      border:none;border-bottom:1px solid var(--ink);border-radius:0;cursor:pointer;
      background:transparent;color:var(--ink);padding:.35rem 0;font-size:1rem;font-weight:500;
    }
    .btn-secondary:hover:not(:disabled),.btn-back:hover:not(:disabled){color:var(--teal);border-bottom-color:var(--teal)}
    .btn-link{
      border:none;background:transparent;color:var(--ink-soft);padding:.35rem 0;
      font-size:.92rem;cursor:pointer;text-decoration:underline;text-underline-offset:.18em;
    }
    .btn-link:hover{color:var(--ink)}
    button:disabled{opacity:.38;cursor:not-allowed}
    .btn-restart{margin-top:1.1rem}
    .clinical-sidebar{
      padding:.15rem 0 0 .15rem;display:flex;flex-direction:column;gap:1.35rem;
      position:sticky;top:1rem;background:transparent;border:none;
    }
    .sidebar-block{display:flex;flex-direction:column;gap:.4rem}
    .side-label{
      font-family:Besley,Georgia,serif;font-style:italic;font-weight:500;
      font-size:1.08rem;color:var(--ink);text-transform:none;letter-spacing:0;
    }
    .progress-caption{font-size:.92rem;color:var(--ink-soft)}
    .match-list{display:flex;flex-direction:column}
    .match-preview{padding:.6rem 0;border:none;border-bottom:1px solid var(--rule);background:transparent}
    .match-head{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin-bottom:.35rem}
    .match-name{font-size:.98rem;font-weight:500;line-height:1.3}
    .match-preview.top .match-name{
      font-weight:700;
      background-image:linear-gradient(transparent 64%, var(--mark) 64%);
      -webkit-box-decoration-break:clone;box-decoration-break:clone;
    }
    .match-value{font-size:.85rem;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums;white-space:nowrap}
    .match-track{height:6px;background:#d5e3db;overflow:hidden}
    .match-fill{height:100%;background:var(--teal)}
    .match-empty{font-size:.95rem;color:var(--ink-soft);line-height:1.45;padding:.2rem 0 .4rem}
    .path-list{display:flex;flex-direction:column;max-height:240px;overflow-y:auto}
    .path-item{font-size:.92rem;color:var(--ink-soft);line-height:1.4;padding:.4rem 0;border-bottom:1px solid #d5e3db}
    .path-item:last-child{border-bottom:none}
    .fade-in{animation:fi .18s ease}
    @keyframes fi{from{opacity:0}to{opacity:1}}
    .results-main{padding:0 1.35rem 1.35rem}
    .analysis-summary{padding:0 0 1rem;margin-bottom:.35rem;border-bottom:1px dashed var(--rule-strong)}
    .analysis-summary h3{
      font-family:Besley,Georgia,serif;font-style:italic;font-weight:500;font-size:1.28rem;margin-bottom:.3rem;
    }
    .analysis-summary p{font-size:1rem;color:var(--ink-soft);line-height:1.5}
    .emergency-screen{padding:1.6rem 1.4rem 1.7rem;max-width:40rem}
    .emergency-screen h2{
      font-family:Besley,Georgia,serif;font-size:clamp(1.8rem,4vw,2.45rem);
      line-height:1.05;font-weight:700;color:var(--alert);margin-bottom:.7rem;letter-spacing:-.02em;
    }
    .emergency-screen p{color:var(--ink);line-height:1.55;margin-bottom:1.15rem;font-size:1.05rem}
    .emergency-actions{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
    .emergency-actions .btn-primary{background:var(--alert);color:#fff8f6}
    .emergency-actions .btn-primary:hover{background:#6e1b16}
    .emergency-continue{display:inline-block;margin-top:1rem}
    .res-card{padding:1.15rem 0 1.2rem;margin:0;background:transparent;border:none;border-top:1px solid var(--rule)}
    .res-card.top{border-top:3px solid var(--ink)}
    .res-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.7rem}
    .res-score{text-align:right;flex-shrink:0}
    .rank-pill{
      display:inline-block;padding:.12rem .4rem;font-family:Besley,Georgia,serif;
      font-style:italic;font-size:.95rem;font-weight:500;
    }
    .r1{background:var(--mark);color:var(--ink)}
    .r2,.r3{color:var(--ink-soft)}
    .match-pct{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:.2rem}
    .match-confidence{font-size:.82rem;color:var(--ink-soft);margin-top:.1rem}
    .res-name{font-family:Besley,Georgia,serif;font-size:1.55rem;font-weight:700;line-height:1.15;letter-spacing:-.02em}
    .res-card.top .res-name{
      background-image:linear-gradient(transparent 64%, var(--mark) 64%);
      -webkit-box-decoration-break:clone;box-decoration-break:clone;
    }
    .res-cat{font-size:.88rem;color:var(--teal);font-weight:700;margin-bottom:.2rem}
    .match-bar-wrap{height:6px;background:#d5e3db;overflow:hidden;margin:.15rem 0 .85rem}
    .match-bar-fill{height:100%}
    .mhigh{background:var(--teal)}.mmed{background:#c4892a}.mlow{background:var(--rule-strong)}
    .res-desc{font-size:1.02rem;color:#24352d;line-height:1.55;margin-bottom:.35rem}
    .sec-label{
      font-family:Besley,Georgia,serif;font-style:italic;font-weight:500;font-size:1.05rem;
      text-transform:none;letter-spacing:0;color:var(--ink);
      margin:.85rem 0 .35rem;display:flex;align-items:center;gap:.45rem;cursor:pointer;user-select:none;width:fit-content;
    }
    .sec-label svg{transition:transform .15s;flex-shrink:0}
    .sec-label.open svg{transform:rotate(90deg)}
    .list-panel{display:none}.list-panel.open{display:block}
    .list{display:flex;flex-direction:column;gap:.28rem;margin:0 0 .7rem .15rem}
    .list-item{display:flex;align-items:flex-start;gap:.55rem;font-size:.98rem;line-height:1.45;color:#24352d}
    .list-item.sym::before,.list-item.trt::before{
      content:"";width:.45rem;height:.45rem;background:var(--teal);flex-shrink:0;margin-top:.45rem;
    }
    .urgency{
      display:inline-block;padding:.2rem .45rem;font-family:Besley,Georgia,serif;
      font-style:italic;font-size:.98rem;font-weight:500;margin-top:.35rem;border:1px solid currentColor;
    }
    .u-low{background:#e7f3e6;color:#1d5c32}
    .u-mod{background:#fff4d4;color:#6a4808}
    .u-high{background:var(--alert-wash);color:var(--alert)}
    .u-note,.res-disclaimer{
      font-size:.95rem;color:var(--ink-soft);margin-top:.65rem;line-height:1.5;
      padding:.1rem 0 .1rem .75rem;background:transparent;border:none;border-left:3px solid var(--rule-strong);border-radius:0;
    }
    .res-disclaimer{margin-top:1.15rem}
    .res-disclaimer strong,.u-note strong{color:var(--ink)}
    .emergency-banner{
      background:var(--alert-wash);border:none;border-left:4px solid var(--alert);
      padding:.8rem .9rem;margin:1rem 0;font-size:.98rem;color:#5e1a14;line-height:1.45;
    }
    .opt:focus-visible,.sec-label:focus-visible,button:focus-visible,.skip:focus{
      outline:2px solid var(--ink);outline-offset:3px;
    }
    .colophon{
      max-width:1080px;margin:0 auto;padding:.85rem 1.4rem 2rem;
      color:var(--ink-soft);font-size:.88rem;border-top:1px solid var(--rule-strong);
    }
    @media(min-width:701px){
      body[data-screen="quiz"] .console{
        display:flex;flex-direction:column;max-height:calc(100dvh - 16.2rem);
      }
      body[data-screen="quiz"] .choice-grid{
        overflow-y:auto;min-height:0;
        scrollbar-width:thin;scrollbar-color:var(--teal-deep) #d5e3db;
      }
      body[data-screen="quiz"] .console-head,
      body[data-screen="quiz"] .composer{flex-shrink:0}
    }
    @media(max-width:900px){
      .workspace{grid-template-columns:1fr}
      .clinical-sidebar{display:none}
      .clinical-sidebar.show-mobile{
        display:flex;position:static;margin-top:1.25rem;padding-top:1rem;border-top:1px dashed var(--rule-strong);
      }
      .console-head .progress-chip{display:block}
    }
    @media(min-width:901px){
      .console-head .progress-chip{display:none}
    }
    @media(max-width:700px){
      .stamp{transform:none}
      .masthead{align-items:flex-start;gap:.75rem;padding:.8rem .9rem .65rem}
      h1{font-size:2.15rem}
    }
    @media(max-width:640px){
      :root{--spine:10px}
      .container{padding:1rem .9rem 1.4rem}
      .masthead{padding:.75rem .8rem .6rem}
      .masthead-sub{font-size:.95rem;margin-top:.25rem}
      .preface{font-size:.92rem;margin-bottom:.85rem}
      .console-head{padding:.85rem .9rem .55rem}
      .console-title{font-size:1.32rem}
      .kicker-row{margin-bottom:.4rem}
      .choice-grid{padding:0 .55rem .25rem}
      .opt{padding:.62rem .15rem}
      .console .composer{display:none}
      #mobile-footer{
        display:block;position:fixed;left:var(--spine);right:0;bottom:0;z-index:50;
        background:var(--sheet);border-top:3px solid var(--ink);
        padding:.7rem .85rem calc(.75rem + env(safe-area-inset-bottom,0px));
      }
      #mobile-footer .key-hint{display:none}
      #mobile-footer .composer-actions{flex-direction:row;align-items:center;gap:.7rem}
      #mobile-footer .action-left{width:auto;display:flex;gap:.75rem;flex-shrink:0}
      #mobile-footer .action-right{flex:1}
      #mobile-footer .btn-next{width:100%;min-height:48px}
      #mobile-footer .btn-back,#mobile-footer .btn-secondary{min-height:44px}
      .results-main{padding:0 .9rem 1rem}
      .emergency-screen{padding:1.15rem .9rem 1.3rem}
      .emergency-actions{flex-direction:column;align-items:stretch}
      .emergency-actions .btn-primary,.emergency-actions .btn-secondary{width:100%;min-height:48px;text-align:center}
      .btn-restart{width:100%;min-height:48px}
      .res-card-header{flex-direction:column;gap:.45rem}
      .res-score{text-align:left}
      .res-name{font-size:1.35rem}
      body:has(#mobile-footer) .container{padding-bottom:6.5rem}
      body:has(#mobile-footer) .colophon{margin-bottom:5.5rem}
      .colophon{padding-left:.9rem;padding-right:.9rem}
    }
    @media(prefers-reduced-motion:reduce){
      .fade-in{animation:none}
      .progress-fill,.sec-label svg{transition:none}
    }
  </style>
</head>
<body>

<a class="skip" href="#app">Skip to the question</a>
<div class="spine" aria-hidden="true"></div>

<header class="masthead">
  <div class="masthead-main">
    <p class="form-code">FORM Q–07</p>
    <h1>Qurest</h1>
    <p class="masthead-sub">For learning. Not a diagnosis.</p>
  </div>
  <p class="stamp" aria-live="polite"><span class="status-text">Just opened</span></p>
</header>

<div class="container">
  <p class="preface"><span>Note.</span> Your answers stay in this browser. Qurest cannot diagnose you. If this might be an emergency, call 911.</p>
  <div id="app"></div>
</div>
<footer class="colophon">Printed-form interview · nothing is saved or sent · call 911 for a real emergency</footer>

<script>

const CONDITIONS = {
  migraine:{name:"Migraine",cat:"Neurological",desc:"A neurological disorder causing recurrent, often severe headaches with sensory disturbances. Affects roughly 1 in 7 people worldwide.",symptoms:["Severe throbbing or pulsating headache (often one-sided)","Nausea and/or vomiting","Sensitivity to light (photophobia) and sound (phonophobia)","Visual aura — flashing lights, blind spots, or zigzag lines","Pain worsened by physical activity","Headache lasting 4–72 hours","Neck stiffness before onset"],treatments:["OTC pain relievers: ibuprofen, naproxen, or aspirin (taken early)","Prescription triptans — sumatriptan, rizatriptan (most effective)","Rest in a dark, quiet room with a cold compress","Anti-nausea medication if needed","Preventive daily medications (topiramate, propranolol, amitriptyline)","Identify and avoid personal triggers (stress, certain foods, irregular sleep)","CGRP antagonists (newer biologic option) for frequent migraines"],urgency:"mod",urgencyNote:"Seek emergency care if this is the 'worst headache of your life' or if accompanied by fever, stiff neck, confusion, weakness, or vision changes."},
  tension_ha:{name:"Tension Headache",cat:"Neurological",desc:"The most common headache type — a dull, aching pressure feeling around the head, often related to stress or muscle tension.",symptoms:["Dull, steady, aching pain on both sides of the head","Sensation of tightness or pressure (like a band around the head)","Tenderness in scalp, neck, and shoulder muscles","No nausea or vomiting (usually)","Mild sensitivity to light or sound","Pain worsens with stress or poor posture"],treatments:["OTC pain relievers: acetaminophen, ibuprofen, or aspirin","Stress management and relaxation techniques (deep breathing, yoga)","Heat or ice applied to neck and shoulders","Regular sleep schedule and adequate hydration","Physical therapy or massage for chronic tension headaches","Avoid overusing pain medication — can cause rebound headaches"],urgency:"low",urgencyNote:"Usually not serious. See a doctor if headaches are frequent, severe, or interfere with daily life."},
  hypertension:{name:"Hypertension (High Blood Pressure)",cat:"Cardiovascular",desc:"Persistently elevated blood pressure in the arteries. Often called the 'silent killer' because most people have no symptoms.",symptoms:["Often completely asymptomatic for years","Headache (especially at the back of the head, upon waking)","Dizziness or lightheadedness","Shortness of breath","Blurred vision","Nosebleeds in severe cases","Flushing or feeling of fullness in the head"],treatments:["Lifestyle: DASH diet, reduce sodium to <1500 mg/day","Regular aerobic exercise (150 min/week)","Maintain a healthy weight; limit alcohol","Quit smoking","Antihypertensive medications: ACE inhibitors, ARBs, beta-blockers, diuretics, calcium channel blockers","Regular blood pressure monitoring at home"],urgency:"mod",urgencyNote:"See a doctor soon to measure your BP. Go to the ER if BP is extremely high with severe headache, chest pain, confusion, or vision changes (hypertensive crisis)."},
  vertigo:{name:"Vertigo / BPPV",cat:"Neurological",desc:"A sensation that you or your surroundings are spinning. Benign Paroxysmal Positional Vertigo (BPPV) is the most common cause.",symptoms:["False spinning sensation or dizziness triggered by head movement","Loss of balance or unsteadiness","Nausea and vomiting","Abnormal eye movements (nystagmus)","Symptoms last seconds to minutes (BPPV) or longer (Meniere's)","Feeling of ear fullness or ringing (in some types)"],treatments:["Epley maneuver (canalith repositioning) — highly effective for BPPV","Vestibular rehabilitation exercises","Meclizine (antihistamine) for symptom relief","Avoid sudden head movements during acute episodes","Diuretics or low-sodium diet for Meniere's disease","Referral to ENT or neurologist for persistent or unusual vertigo"],urgency:"mod",urgencyNote:"Seek emergency care if vertigo is sudden and accompanied by severe headache, double vision, difficulty speaking or walking, or facial numbness."},
  common_cold:{name:"Common Cold",cat:"Respiratory / Viral",desc:"A very common viral infection of the upper respiratory tract, primarily caused by rhinoviruses. Usually mild and self-limiting.",symptoms:["Runny or stuffy nose (nasal congestion)","Sore or scratchy throat (early symptom)","Frequent sneezing","Mild cough","Low-grade fever (more common in children)","Mild body aches or headache","Generally feeling unwell (malaise); symptoms peak days 2–3"],treatments:["Rest and stay well-hydrated","OTC decongestants (pseudoephedrine) for nasal congestion","OTC pain relievers (acetaminophen or ibuprofen) for aches","Throat lozenges and warm liquids (broth, tea with honey) for sore throat","Saline nasal sprays or rinses for congestion relief","Honey for cough (adults and children over 1 year) — evidence-based"],urgency:"low",urgencyNote:"Usually resolves in 7–10 days. See a doctor if symptoms worsen after day 5, you develop a high fever, difficulty breathing, or chest pain."},
  influenza:{name:"Influenza (Flu)",cat:"Respiratory / Viral",desc:"A contagious respiratory illness caused by influenza viruses, typically more severe and faster onset than the common cold.",symptoms:["Sudden onset of high fever (100–104°F / 38–40°C)","Chills and sweats","Severe muscle aches and body pain","Headache","Dry, persistent cough","Extreme fatigue and weakness (can be debilitating)","Sore throat and sometimes runny nose","Loss of appetite"],treatments:["Rest and plenty of fluids","Antiviral medications (oseltamivir/Tamiflu) — most effective within 48 hours of symptoms","OTC fever reducers and pain relievers (ibuprofen or acetaminophen)","Do NOT give aspirin to children (Reye's syndrome risk)","Isolate to prevent spreading to others","Annual flu vaccination for prevention"],urgency:"mod",urgencyNote:"Seek care promptly if you have difficulty breathing, persistent chest pain, confusion, severe vomiting, or belong to a high-risk group (elderly, pregnant, immunocompromised)."},
  covid19:{name:"COVID-19",cat:"Respiratory / Viral",desc:"A respiratory illness caused by SARS-CoV-2, with a wide spectrum of severity from mild cold-like symptoms to serious pneumonia.",symptoms:["Fever or chills","Dry cough (most common)","Shortness of breath or difficulty breathing","Fatigue","Muscle or body aches","Loss of taste (ageusia) or smell (anosmia) — hallmark symptom","Sore throat, congestion, or runny nose","Headache","Nausea, vomiting, or diarrhea"],treatments:["Isolate immediately to prevent spread","Rest and stay well-hydrated","OTC medications for fever and pain","Antiviral treatments (nirmatrelvir/Paxlovid) for high-risk patients — requires prescription, within 5 days of symptoms","Monitor oxygen saturation with a pulse oximeter","COVID-19 vaccination and boosters for prevention"],urgency:"mod",urgencyNote:"Seek emergency care for severe breathing difficulty, persistent chest pressure, confusion, inability to stay awake, or bluish lips/fingernails."},
  strep:{name:"Strep Throat",cat:"Respiratory / Bacterial",desc:"A bacterial infection of the throat and tonsils caused by Group A Streptococcus. Requires antibiotics to prevent complications.",symptoms:["Sudden, severe sore throat — often the worst you've felt","Significant pain with swallowing","High fever (101°F / 38.3°C or higher)","Red, swollen tonsils, sometimes with white patches or pus","Tiny red spots on the roof of the mouth (petechiae)","Swollen, tender lymph nodes in the front of the neck","Headache and body aches — NO cough (absence of cough is a key clue)"],treatments:["Antibiotics (penicillin or amoxicillin) — requires prescription, mandatory to prevent complications","Complete the FULL antibiotic course even if feeling better","OTC pain relievers and fever reducers (ibuprofen or acetaminophen)","Salt water gargling to reduce pain and swelling","Throat lozenges and cool or warm liquids","Stay home and rest until fever-free and 24 hours on antibiotics"],urgency:"mod",urgencyNote:"See a doctor for a rapid strep test and antibiotics. Untreated strep can lead to rheumatic fever, which can damage the heart."},
  allergic_rhinitis:{name:"Allergic Rhinitis (Hay Fever)",cat:"Respiratory / Allergic",desc:"An allergic reaction causing cold-like symptoms, triggered by airborne allergens like pollen, dust mites, mold, or pet dander.",symptoms:["Runny nose with clear, watery discharge","Sneezing fits (often multiple sneezes in a row)","Itchy nose, eyes, and throat","Watery, red, or swollen eyes (allergic conjunctivitis)","Nasal congestion and blocked sinuses","Postnasal drip causing sore throat","Symptoms seasonal (tree/grass/weed pollen) or year-round (dust mites, pets)"],treatments:["Antihistamines (cetirizine/Zyrtec, loratadine/Claritin, fexofenadine/Allegra)","Intranasal corticosteroid sprays — most effective treatment (fluticasone, budesonide)","Decongestants for nasal congestion (short-term use)","Avoid known allergens, keep windows closed during high pollen days","HEPA air purifiers and regular vacuuming","Allergy immunotherapy (shots or sublingual drops) for long-term relief"],urgency:"low",urgencyNote:"Not dangerous in most cases. See an allergist if symptoms are severe, uncontrolled, or significantly impact your quality of life."},
  asthma:{name:"Asthma",cat:"Respiratory / Chronic",desc:"A chronic inflammatory condition where airways narrow and swell, producing extra mucus, making breathing difficult.",symptoms:["Wheezing (whistling or squeaky sound when breathing)","Shortness of breath, especially with activity","Chest tightness or pressure","Coughing — often worse at night or early morning","Symptoms triggered by exercise, cold air, allergens, or smoke","Respiratory infections can trigger significant worsening","Symptoms vary in frequency and intensity"],treatments:["Short-acting bronchodilators (albuterol inhaler) for quick relief — carry at all times","Inhaled corticosteroids (ICS) for long-term control (most important)","Long-acting bronchodilators (LABA) as add-on to ICS","Identify and avoid personal triggers","Develop an asthma action plan with your doctor","Leukotriene modifiers (montelukast) as alternative or add-on"],urgency:"mod",urgencyNote:"EMERGENCY: Call 911 if rescue inhaler provides no relief, breathing is very difficult, you're struggling to complete sentences, or lips/fingernails turn bluish."},
  bronchitis:{name:"Acute Bronchitis",cat:"Respiratory / Viral",desc:"Inflammation of the bronchial tube lining, usually from a viral infection, causing persistent cough and mucus production.",symptoms:["Persistent cough — may be productive (mucus) or dry","Mucus that may be clear, white, yellow, or green","Chest discomfort or soreness from coughing","Fatigue and mild malaise","Slight fever and chills","Mild shortness of breath during activity","Wheezing in some cases"],treatments:["Rest and increased fluid intake to thin mucus","Honey for cough relief (proven effective)","OTC cough suppressants or expectorants (guaifenesin)","Use a humidifier to ease breathing and soothe airways","Antibiotics are NOT usually needed (viral cause in 90%+ of cases)","Bronchodilator inhaler if wheezing is present","See a doctor if symptoms persist beyond 3 weeks or worsen significantly"],urgency:"low",urgencyNote:"Usually resolves in 2–3 weeks. See a doctor if coughing blood, high fever (>103°F), severe breathing difficulty, or symptoms that worsen after improving."},
  gerd:{name:"GERD (Acid Reflux / Heartburn)",cat:"Digestive / GI",desc:"Gastroesophageal reflux disease — stomach acid frequently flows back into the esophagus, causing irritation and symptoms.",symptoms:["Burning chest pain (heartburn), especially after eating or when lying down","Regurgitation of food or sour liquid into the mouth","Difficulty or pain with swallowing","Sensation of a lump in the throat (globus sensation)","Chronic cough or hoarseness (from acid reaching throat)","Worsening symptoms when lying down, bending, or after large meals","Dental erosion over time"],treatments:["Antacids (Tums, Mylanta) for immediate but short-term relief","H2 blockers (famotidine/Pepcid) to reduce acid production","Proton pump inhibitors (omeprazole/Prilosec, pantoprazole) for sustained relief","Avoid trigger foods: spicy, fatty, citrus, caffeine, carbonation, alcohol, chocolate","Eat smaller meals; avoid lying down within 3 hours of eating","Elevate the head of the bed 6–8 inches; maintain a healthy weight"],urgency:"low",urgencyNote:"See a doctor if symptoms are frequent, persistent, or accompanied by difficulty swallowing, unexplained weight loss, or vomiting blood."},
  ibs:{name:"Irritable Bowel Syndrome (IBS)",cat:"Digestive / Functional",desc:"A common functional GI disorder causing chronic abdominal pain and altered bowel habits without structural damage to the bowel.",symptoms:["Abdominal pain or cramping, often relieved by a bowel movement","Bloating and excess gas","Diarrhea, constipation, or alternating between both","Mucus in the stool (white)","Urgent need to have a bowel movement","Symptoms often triggered or worsened by stress, anxiety, or certain foods","No blood in stool (if blood is present, see a doctor urgently)"],treatments:["Dietary changes: low-FODMAP diet (fermentable carbs) is well-supported","Soluble fiber supplementation for constipation-predominant IBS","Antispasmodics (hyoscine, dicycloverine) for cramping","Anti-diarrheal medications (loperamide/Imodium) as needed","Stress management, mindfulness, and regular exercise","Gut-directed cognitive behavioral therapy (CBT) has strong evidence","Peppermint oil capsules (enteric-coated) for cramps and bloating"],urgency:"low",urgencyNote:"See a doctor for proper diagnosis. Seek urgent care if you have rectal bleeding, unexplained weight loss, fever, or anemia with GI symptoms."},
  gastroenteritis:{name:"Gastroenteritis (Stomach Bug)",cat:"Digestive / Infectious",desc:"Inflammation of the stomach and intestines, typically from a viral (most common) or bacterial infection.",symptoms:["Sudden onset of nausea and vomiting","Watery, loose diarrhea (may be frequent)","Abdominal cramps and pain","Low-grade fever","Headache and muscle aches","Dehydration symptoms: dry mouth, decreased urination, dizziness","Usually lasts 1–3 days for viral causes"],treatments:["Stay well-hydrated with oral rehydration solutions (Pedialyte, Hydralyte)","Small sips frequently — avoid large volumes at once","Bland diet when tolerated (bananas, rice, toast, crackers)","Anti-nausea medications (ondansetron) if available","Rest","Avoid dairy, fatty, or spicy foods during recovery","Antibiotics only for confirmed bacterial causes (Salmonella, Campylobacter)"],urgency:"low",urgencyNote:"See a doctor if unable to keep any fluids down for 24+ hours, blood in stool, high fever, severe abdominal pain, or signs of significant dehydration (especially in children or elderly)."},
  peptic_ulcer:{name:"Peptic Ulcer",cat:"Digestive / GI",desc:"Sores (ulcers) in the lining of the stomach or upper small intestine, usually caused by H. pylori infection or NSAID overuse.",symptoms:["Burning or gnawing stomach pain, often between meals or at night","Pain that is temporarily relieved by eating food or taking antacids","Bloating and belching","Nausea and sometimes vomiting","Feeling of fullness after eating small amounts","Heartburn","Dark, tarry stools (bleeding ulcer — see a doctor immediately)"],treatments:["Proton pump inhibitors (omeprazole, lansoprazole) to reduce stomach acid","Antibiotics (two-drug combination) if H. pylori infection is confirmed","Discontinue NSAIDs (ibuprofen, aspirin, naproxen) if possible","Antacids for symptom relief","Avoid alcohol, smoking, and extremely spicy foods","Follow-up testing to confirm H. pylori eradication"],urgency:"mod",urgencyNote:"See a doctor. Go to the ER immediately for vomiting blood, black or tarry stools, or sudden, severe stomach pain (possible perforation)."},
  appendicitis:{name:"Appendicitis",cat:"Digestive / Surgical Emergency",desc:"Inflammation of the appendix — this is a surgical emergency requiring immediate medical evaluation.",symptoms:["Pain that starts around the navel then moves to the lower right abdomen","Pain that intensifies over hours and worsens with movement, coughing, or deep breathing","Nausea and vomiting","Fever (low-grade early, higher if appendix ruptures)","Loss of appetite","Inability to pass gas","Rigid, guarded abdomen (sign of inflammation)"],treatments:["SEEK EMERGENCY CARE IMMEDIATELY — do not wait","Surgical removal of the appendix (appendectomy) — often laparoscopic","IV antibiotics before and after surgery","Some uncomplicated cases may be treated with antibiotics alone (discuss with surgeon)","Do NOT eat, drink, or take pain medication until evaluated — can mask symptoms"],urgency:"high",urgencyNote:"THIS IS A MEDICAL EMERGENCY. Go to the emergency room now. A ruptured appendix is life-threatening and can occur within 24–72 hours of onset."},
  uti:{name:"Urinary Tract Infection (UTI)",cat:"Urinary / Infectious",desc:"A bacterial infection in the urinary system — bladder (cystitis) or urethra. Very common, especially in women.",symptoms:["Burning or stinging sensation when urinating","Frequent, urgent need to urinate (often with little urine output)","Cloudy, dark, or strong-smelling urine","Pelvic pain or pressure (in women)","Rectal discomfort (in men)","Blood in urine (pink or red tinge)","Low-grade fever or chills (may indicate kidney involvement)"],treatments:["Antibiotics (trimethoprim-sulfamethoxazole, nitrofurantoin, or fosfomycin) — requires prescription","Drink plenty of water to help flush bacteria","Phenazopyridine (AZO) for burning/urgency symptom relief (turns urine orange)","Avoid caffeine, alcohol, and citrus during treatment","Cranberry products may help prevent future UTIs","Complete the full antibiotic course even if feeling better"],urgency:"mod",urgencyNote:"See a doctor for antibiotics. Seek urgent care if you develop fever, back or flank pain, nausea or vomiting — these suggest kidney infection (pyelonephritis), which needs IV antibiotics."},
  kidney_stones:{name:"Kidney Stones",cat:"Urinary / Acute",desc:"Hard mineral and salt deposits that form in the kidneys and can cause excruciating pain when moving through the urinary tract.",symptoms:["Severe, sharp pain in the back, side, lower abdomen, or groin (renal colic)","Pain that comes in waves and fluctuates in intensity","Blood in the urine (pink, red, or brown — hematuria)","Painful urination","Nausea and vomiting","Frequent urge to urinate","Fever and chills if an infection is also present"],treatments:["Pain management: NSAIDs (ketorolac) or opioids for severe pain","Drink 2–3 liters of water daily to help pass the stone","Alpha-blockers (tamsulosin) to relax ureter and aid stone passage","Shock wave lithotripsy (ESWL) for stones 4–20mm","Ureteroscopy or percutaneous nephrolithotomy for large or stuck stones","Dietary prevention: reduce sodium, animal protein, oxalate foods; stay hydrated"],urgency:"high",urgencyNote:"Go to urgent care or the ER for severe pain. Emergency care is needed if fever is present with stone symptoms (infected obstructed kidney is an emergency) or if you're unable to urinate."},
  eczema:{name:"Eczema (Atopic Dermatitis)",cat:"Skin / Inflammatory",desc:"A chronic inflammatory skin condition causing dry, itchy, and inflamed skin. Often starts in childhood and runs in families.",symptoms:["Dry, sensitive, and easily irritated skin","Intense itching, especially at night","Red to brownish-gray patches","Small, raised bumps that may weep fluid and crust over","Thickened, cracked, or scaly skin","Raw, swollen skin from scratching","Common locations: elbow creases, behind knees, neck, wrists, and face"],treatments:["Moisturize frequently with thick, fragrance-free creams or ointments (apply within 3 min of bathing)","Topical corticosteroids (hydrocortisone to stronger prescriptions) to reduce flares","Topical calcineurin inhibitors (tacrolimus, pimecrolimus) for sensitive areas","Antihistamines for itch relief (especially at night)","Identify and avoid triggers: harsh soaps, fragrances, wool, sweating, stress","Biologic medications (dupilumab/Dupixent) for moderate-to-severe cases"],urgency:"low",urgencyNote:"See a dermatologist for proper diagnosis, prescription treatments, and a long-term management plan."},
  contact_dermatitis:{name:"Contact Dermatitis",cat:"Skin / Allergic",desc:"A localized red, itchy rash caused by direct skin contact with a substance that either irritates the skin or triggers an allergic reaction.",symptoms:["Red rash precisely limited to the area of skin contact","Intense itching","Dry, cracked, or scaly skin","Bumps, blisters, and possible weeping","Swelling, burning, or tenderness","Rash appears where the triggering item touched the skin","Can develop hours (allergic) or immediately (irritant) after contact"],treatments:["Identify and permanently avoid the triggering substance","Wash the affected skin with mild soap and cool water immediately","Topical corticosteroid cream (OTC hydrocortisone 1% or prescription strength)","Cool, wet compresses for soothing relief","Oral antihistamines for itching, especially at night","Oral or injected corticosteroids for severe, widespread reactions"],urgency:"low",urgencyNote:"See a doctor if rash doesn't improve in 2–3 weeks, is very severe, covers large areas, or affects the eyes or mucous membranes."},
  hives:{name:"Hives (Urticaria)",cat:"Skin / Allergic",desc:"Raised, red, itchy welts on the skin — a very common allergic reaction that can appear anywhere on the body and change rapidly.",symptoms:["Red or skin-colored raised welts (wheals) of varying sizes","Welts that appear, change shape, and disappear within hours","Skin turns white (blanches) when pressed","Intense itching or burning sensation","May be accompanied by angioedema (deeper swelling, especially lips/eyes)","Can be triggered by foods, medications, infections, insect stings, or stress","Individual welts typically resolve within 24 hours"],treatments:["Antihistamines (cetirizine, loratadine, diphenhydramine for nighttime)","Cool compresses for soothing relief","Avoid scratching (worsens inflammation)","Identify and remove the triggering allergen","Oral corticosteroids for severe or widespread cases","Epinephrine (EpiPen) if anaphylaxis develops — use immediately"],urgency:"mod",urgencyNote:"CALL 911 if hives are accompanied by throat swelling, difficulty breathing, dizziness, or rapid heartbeat — this is anaphylaxis and is life-threatening."},
  psoriasis:{name:"Psoriasis",cat:"Skin / Autoimmune",desc:"A chronic autoimmune condition causing rapid buildup of skin cells, resulting in thick, scaly patches. Not contagious.",symptoms:["Red or pink patches covered with thick, silvery-white scales","Dry, cracked skin that may bleed","Itching, burning, or soreness in affected areas","Thickened, pitted, or ridged nails","Joint pain and stiffness (psoriatic arthritis — affects ~30%)","Common locations: scalp, elbows, knees, lower back, nails","Cycles of flares and remissions"],treatments:["Topical corticosteroids (mainstay of mild-moderate treatment)","Vitamin D analogues (calcipotriene/Dovonex) to slow skin cell growth","Topical retinoids (tazarotene)","Light therapy: UVB phototherapy or PUVA","Systemic medications (methotrexate, cyclosporine) for moderate-severe cases","Biologic medications (TNF inhibitors, IL-17/IL-23 inhibitors) — highly effective","Stress management; stress is a major trigger"],urgency:"low",urgencyNote:"See a dermatologist for diagnosis. If you have joint pain and swelling, also see a rheumatologist to rule out psoriatic arthritis."},
  muscle_strain:{name:"Muscle Strain",cat:"Musculoskeletal",desc:"An injury to a muscle or tendon caused by overuse, improper lifting, or a sudden, forceful movement.",symptoms:["Sudden onset of localized pain during or after activity","Muscle spasm in the affected area","Limited range of motion","Swelling, bruising, or redness around the injury site","Tenderness to touch","Weakness in the affected muscle","Pain that worsens with specific movements"],treatments:["RICE method: Rest, Ice (20 min, 3–4x daily), Compression, Elevation for first 48–72 hours","OTC anti-inflammatory pain relievers (ibuprofen, naproxen)","Acetaminophen for pain if NSAIDs not tolerated","Gentle stretching and gradual return to activity after 48–72 hours","Heat therapy (warm compress, heating pad) after the first 3 days","Physical therapy for moderate-to-severe strains","Prescribed muscle relaxants for severe spasm (short-term)"],urgency:"low",urgencyNote:"Most strains resolve in days to a few weeks. See a doctor if severe pain, significant swelling/bruising, a 'pop' was heard at injury, or no improvement after 2 weeks."},
  arthritis:{name:"Osteoarthritis",cat:"Musculoskeletal / Chronic",desc:"Degeneration of joint cartilage causing pain, stiffness, and reduced mobility. Most common in older adults and in high-use joints.",symptoms:["Joint pain that worsens with activity and improves with rest","Morning stiffness that typically lasts less than 30 minutes","Reduced range of motion in affected joints","Grating, cracking, or popping sensation (crepitus)","Bone spurs that may be felt around the joint","Swelling and tenderness around the joint","Most common in knees, hips, hands, and spine"],treatments:["OTC pain relievers: acetaminophen (for mild pain), NSAIDs (ibuprofen, naproxen) for inflammation","Topical NSAIDs (diclofenac gel/Voltaren) — effective with fewer side effects","Regular low-impact exercise: swimming, cycling, walking (reduces pain and improves function)","Physical therapy for strength and joint stability","Weight loss to reduce load on weight-bearing joints","Intra-articular injections: corticosteroids or hyaluronic acid","Joint replacement surgery for severe, end-stage disease"],urgency:"low",urgencyNote:"See a doctor for diagnosis and a management plan. Note: Rheumatoid arthritis (autoimmune, different treatment) has similar symptoms — morning stiffness >1 hour and symmetric joint involvement are key differences."},
  lower_back:{name:"Lower Back Pain",cat:"Musculoskeletal",desc:"Pain in the lumbar region of the spine — one of the most common medical complaints worldwide. Usually mechanical in origin.",symptoms:["Dull aching or sharp, stabbing pain in the lower back","Pain that radiates into the buttocks, thigh, or down the leg (sciatica)","Muscle stiffness and spasm","Pain worsened by bending, lifting, prolonged sitting or standing","Limited flexibility or reduced range of motion in the spine","Numbness or tingling down the leg (nerve involvement)","Pain that improves with movement and walking"],treatments:["Stay active — avoid prolonged bed rest (worsens recovery)","OTC NSAIDs (ibuprofen, naproxen) or acetaminophen","Application of ice (first 48 hours) then heat","Physical therapy: core strengthening, stretching, McKenzie method","Short-term muscle relaxants if prescribed by a doctor","Ergonomic adjustments to workstation and sleeping position","Epidural steroid injections for severe nerve-related pain"],urgency:"low",urgencyNote:"See a doctor urgently if pain follows significant trauma, or causes bladder/bowel dysfunction, saddle-area numbness, or progressive leg weakness — these may indicate cauda equina syndrome."},
  anxiety:{name:"Generalized Anxiety Disorder (GAD)",cat:"Mental Health",desc:"A condition characterized by persistent, excessive worry about various aspects of life that is difficult to control.",symptoms:["Excessive, uncontrollable worry about multiple areas of life","Restlessness or feeling on edge or 'keyed up'","Fatigue and difficulty concentrating ('mind going blank')","Irritability","Muscle tension, especially in neck, shoulders, and back","Sleep disturbances — difficulty falling or staying asleep","Physical symptoms: rapid heartbeat, sweating, trembling, upset stomach"],treatments:["Cognitive-behavioral therapy (CBT) — gold standard, very effective","SSRIs (sertraline, escitalopram) or SNRIs (venlafaxine) — first-line medications","Buspirone — non-habit-forming anti-anxiety medication","Regular aerobic exercise (strong, well-researched benefit for anxiety)","Mindfulness-based stress reduction (MBSR) and relaxation techniques","Limit caffeine and alcohol; maintain regular sleep schedule","Support groups and stress management skills"],urgency:"mod",urgencyNote:"Please seek mental health support — anxiety is very treatable. If you are having thoughts of harming yourself, call or text 988 (Suicide & Crisis Lifeline) or go to the ER."},
  depression:{name:"Major Depressive Disorder (Depression)",cat:"Mental Health",desc:"A mood disorder causing persistent feelings of sadness, emptiness, and hopelessness, along with physical and cognitive symptoms.",symptoms:["Persistent sad, empty, hopeless, or 'numb' mood, most of the day, nearly every day","Loss of interest or pleasure in activities once enjoyed (anhedonia)","Significant weight loss/gain or change in appetite","Insomnia or sleeping too much","Fatigue, low energy, or feeling 'slowed down'","Difficulty concentrating, remembering, or making decisions","Feelings of worthlessness, guilt, or self-blame","Recurrent thoughts of death or suicide"],treatments:["Psychotherapy: CBT, interpersonal therapy (IPT), or behavioral activation","Antidepressants: SSRIs (fluoxetine, sertraline) or SNRIs — often combined with therapy for best results","Regular aerobic exercise (proven to be as effective as medication in mild-moderate depression)","Social support and maintaining daily structure and routines","Light therapy for seasonal affective disorder (SAD)","Electroconvulsive therapy (ECT) for severe or treatment-resistant depression","Ketamine or esketamine (Spravato) for treatment-resistant cases"],urgency:"mod",urgencyNote:"Depression is very treatable — please seek help. If you are having thoughts of suicide, call or text 988 (Suicide & Crisis Lifeline), text HOME to 741741, or go to the nearest ER."},
  panic_disorder:{name:"Panic Disorder",cat:"Mental Health",desc:"Recurrent, unexpected panic attacks with intense physical symptoms, accompanied by ongoing fear of future attacks.",symptoms:["Sudden, intense episodes of overwhelming fear (panic attacks) peaking within minutes","Racing or pounding heart (palpitations)","Shortness of breath or feeling smothered","Chest pain or tightness (can mimic heart attack)","Dizziness, lightheadedness, or feeling faint","Sweating, trembling, or shaking","Sense of unreality (derealization) or detachment from oneself (depersonalization)","Fear of dying, losing control, or 'going crazy' during attacks"],treatments:["Cognitive-behavioral therapy (CBT) — highly effective; includes interoceptive exposure","SSRIs (first-line medication) or SNRIs — take weeks to work","Benzodiazepines: effective for acute attacks but habit-forming (short-term only)","Diaphragmatic breathing techniques to manage acute symptoms","Gradually facing avoided situations (exposure therapy) with therapist guidance","Avoid caffeine and alcohol; get regular sleep","Psychoeducation: understanding that panic attacks, while terrifying, are not dangerous"],urgency:"mod",urgencyNote:"First episode of chest pain and shortness of breath should be medically evaluated to rule out cardiac causes before attributing to panic. Seek emergency care if uncertain."},
  insomnia:{name:"Insomnia",cat:"Mental Health / Sleep",desc:"Persistent difficulty falling asleep, staying asleep, or getting restorative sleep, causing daytime impairment.",symptoms:["Difficulty falling asleep at bedtime (sleep onset insomnia)","Waking frequently during the night and struggling to return to sleep","Waking too early in the morning","Not feeling rested or refreshed after sleep","Daytime fatigue, low energy, and sleepiness","Difficulty concentrating, memory problems, or poor performance","Irritability, anxiety, or low mood","Worry about sleep itself — becomes self-perpetuating"],treatments:["Cognitive-behavioral therapy for insomnia (CBT-I) — most effective long-term treatment; outperforms medication","Sleep hygiene: consistent wake time daily, dark/cool/quiet room, no screens 1 hour before bed","Stimulus control: use bed only for sleep and sex; get out of bed if unable to sleep after 20 min","Sleep restriction therapy (guided) — paradoxically improves sleep quality","Melatonin supplements: useful for sleep timing issues","Short-term sleep medications (zolpidem) — as directed by doctor, not for long-term use","Address underlying conditions: anxiety, depression, chronic pain, sleep apnea"],urgency:"low",urgencyNote:"See a doctor or sleep specialist if insomnia has persisted for more than 3 months or is significantly impairing daily functioning. Rule out sleep apnea (may need a sleep study)."},
  fever_general:{name:"Systemic Viral Illness / Fever",cat:"Infectious / General",desc:"A general, non-specific viral or bacterial illness causing fever and systemic symptoms. Requires evaluation to determine specific cause.",symptoms:["Fever (above 100.4°F / 38°C)","Chills and sweating (may alternate)","Generalized body aches and myalgia","Headache","Fatigue and malaise","Loss of appetite","General feeling of being unwell"],treatments:["Rest and stay well-hydrated","Fever reducers: acetaminophen or ibuprofen (alternate for better control if needed)","Monitor temperature regularly","Seek medical evaluation to determine the underlying cause","Antibiotics if a bacterial infection is confirmed (not for viral illnesses)","Antiviral medications for specific diagnosed viral infections"],urgency:"mod",urgencyNote:"See a doctor if fever is above 103°F, lasts more than 3 days, or is accompanied by severe symptoms. Go to the ER for stiff neck, severe headache, rash, confusion, or difficulty breathing with fever."},
  anemia:{name:"Anemia",cat:"Blood / Systemic",desc:"A condition where there aren't enough healthy red blood cells to carry adequate oxygen to the body's tissues.",symptoms:["Persistent fatigue and weakness (most common symptom)","Pale or sallow (yellowish) skin","Shortness of breath, especially with exertion","Dizziness or lightheadedness","Fast or irregular heartbeat (palpitations)","Cold hands and feet","Headache","Brittle or spoon-shaped nails"],treatments:["Iron supplements (ferrous sulfate) for iron-deficiency anemia","Vitamin B12 supplements or monthly injections for B12-deficiency anemia","Folate supplements for folate-deficiency anemia","Dietary changes: increase iron-rich foods (lean red meat, spinach, lentils, fortified cereals)","Treat the underlying cause (e.g., stop bleeding, treat chronic disease)","Blood transfusions for severe acute anemia","Erythropoiesis-stimulating agents for anemia of chronic kidney disease"],urgency:"mod",urgencyNote:"See a doctor for blood tests (complete blood count) to confirm the diagnosis and identify the type. Seek urgent care for severe shortness of breath, chest pain, or fainting."},
  diabetes:{name:"Type 2 Diabetes (Risk Indicator)",cat:"Metabolic / Endocrine",desc:"A metabolic disorder where the body doesn't use insulin effectively, leading to elevated blood sugar levels over time.",symptoms:["Increased thirst (polydipsia)","Frequent urination (polyuria), especially at night","Increased hunger even after eating","Unexplained weight loss","Fatigue and lack of energy","Blurred vision (from lens swelling due to high sugar)","Slow-healing sores or cuts","Frequent infections (skin, urinary tract, yeast)","Tingling, numbness, or pain in hands or feet (neuropathy)"],treatments:["Regular blood glucose monitoring","Healthy diet: reduce refined carbohydrates, sugars, and processed foods; increase fiber","Regular physical activity (improves insulin sensitivity significantly)","Metformin — first-line oral medication","Other medications: SGLT-2 inhibitors, GLP-1 agonists, DPP-4 inhibitors as needed","Insulin therapy if oral medications insufficient","Weight management and smoking cessation"],urgency:"mod",urgencyNote:"See a doctor for fasting blood glucose and HbA1c tests to confirm. Uncontrolled diabetes can lead to serious complications affecting the heart, kidneys, eyes, and nerves."},
  gout:{name:"Gout",cat:"Musculoskeletal / Metabolic",desc:"A form of inflammatory arthritis caused by uric acid crystal deposits in joints, causing sudden, severe pain attacks.",symptoms:["Sudden onset of severe, intense joint pain — often at night","Big toe is most commonly affected (podagra), also ankle, knee, wrist","Joint feels hot, swollen, and appears red or purplish","Pain is often described as excruciating — even light touch is unbearable","Acute attacks typically last 3–10 days without treatment","Tophi (lumps) under skin in chronic gout","Decreased range of motion in affected joint"],treatments:["NSAIDs (indomethacin, naproxen) as first-line for acute attacks","Colchicine (most effective when taken early in an attack)","Oral or injected corticosteroids if NSAIDs and colchicine not tolerated","Elevate and rest the affected joint; apply ice packs","Uric acid-lowering therapy (allopurinol, febuxostat) for prevention (not during acute attacks)","Dietary changes: limit alcohol (especially beer), red meat, shellfish, and high-fructose corn syrup","Stay well-hydrated — 8+ glasses of water daily"],urgency:"mod",urgencyNote:"See a doctor for diagnosis (serum uric acid, possible joint aspiration). Seek urgent care if a joint is extremely hot and swollen with a fever — this could be an infected joint (septic arthritis), which is an emergency."},
  concussion:{name:"Concussion",cat:"Neurological / Injury",desc:"A mild traumatic brain injury that can happen after a blow to the head or body, causing temporary changes in brain function.",symptoms:["Headache or pressure in the head after an injury","Dizziness, balance trouble, or feeling slowed down","Nausea or vomiting","Sensitivity to light or noise","Trouble concentrating or remembering","Fatigue, sleepiness, or feeling foggy","Irritability or mood changes"],treatments:["Physical and cognitive rest for the first 24–48 hours","Gradual return to school, work, and exercise as symptoms improve","Acetaminophen for headache if advised by a clinician","Avoid alcohol, driving, and activities with risk of another head injury","Medical evaluation if symptoms persist beyond a few days","Follow a clinician-guided return-to-play protocol for sports"],urgency:"mod",urgencyNote:"Seek urgent medical care for worsening headache, repeated vomiting, confusion, seizure, fainting, weakness, slurred speech, or unusual drowsiness after a head injury."},
  sinusitis:{name:"Sinusitis (Sinus Infection / Inflammation)",cat:"Head / ENT",desc:"Inflammation of the sinuses causing facial pressure, congestion, and thick nasal drainage. It often follows a cold or allergy flare.",symptoms:["Facial pressure or pain, especially around the cheeks, eyes, or forehead","Nasal congestion or blocked nose","Thick yellow or green nasal mucus","Pain that worsens when bending forward","Reduced sense of smell","Upper tooth pain or facial tenderness","Bad breath or postnasal drip"],treatments:["Saline nasal rinses to clear mucus","Intranasal steroid spray (fluticasone) to reduce inflammation","Rest, hydration, and humidified air","Short-term decongestants if appropriate","Treat underlying allergies if they contribute","See a clinician if symptoms last more than 10 days or worsen after initial improvement"],urgency:"low",urgencyNote:"Usually not an emergency. See a doctor if symptoms last more than 10 days, keep coming back, cause high fever, or involve swelling around the eyes."},
  pneumonia:{name:"Pneumonia",cat:"Respiratory / Infectious",desc:"An infection of the lungs that can cause cough, fever, chest pain, and shortness of breath. It may be viral or bacterial.",symptoms:["Deep cough, often with mucus","Fever, chills, and sweating","Shortness of breath or breathing faster than normal","Chest pain that worsens with a deep breath or cough","Fatigue and weakness","Low appetite","Sometimes confusion, especially in older adults"],treatments:["Prompt medical evaluation to confirm the diagnosis","Antibiotics if bacterial pneumonia is suspected or confirmed","Rest, fluids, and fever control","Prescription inhalers or oxygen support if needed","Hospital care for low oxygen, dehydration, or severe illness","Vaccination can help prevent some types of pneumonia"],urgency:"mod",urgencyNote:"Seek urgent medical care for trouble breathing, chest pain, blue lips, confusion, dehydration, or oxygen levels that seem low. Pneumonia can worsen quickly in children, older adults, and high-risk patients."},
  gallstones:{name:"Gallstones",cat:"Digestive / Hepatobiliary",desc:"Hardened deposits that form in the gallbladder and can trigger episodes of pain, especially after fatty meals.",symptoms:["Pain in the upper right abdomen or center upper belly","Pain after fried, greasy, or heavy meals","Pain that may radiate to the right shoulder or back","Nausea or vomiting during attacks","Episodes that come in waves and then ease off","Bloating or indigestion after meals","Tenderness under the right ribs"],treatments:["Medical evaluation and ultrasound to confirm gallstones","Low-fat meals to reduce attacks while awaiting treatment","Pain control as directed by a clinician","Gallbladder removal surgery (cholecystectomy) for recurrent or complicated cases","Urgent care if fever, jaundice, or persistent vomiting develops"],urgency:"mod",urgencyNote:"See a doctor promptly if attacks recur. Go urgently if pain lasts more than a few hours or is accompanied by fever, yellowing of the skin/eyes, dark urine, or vomiting."},
  constipation:{name:"Constipation",cat:"Digestive / Bowel",desc:"Infrequent, difficult, or uncomfortable bowel movements, often related to diet, dehydration, medication effects, or gut motility.",symptoms:["Fewer than 3 bowel movements per week","Hard, dry, or lumpy stools","Straining to pass stool","Feeling that stool is stuck or incomplete","Bloating or abdominal discomfort","Needing to use manual maneuvers or extra time to pass stool"],treatments:["Increase fluids and dietary fiber gradually","Regular physical activity","Osmotic laxatives such as polyethylene glycol (Miralax) if needed","Stool softeners or stimulant laxatives for short-term use","Review medications that may contribute","Medical evaluation if constipation is persistent, worsening, or associated with alarm symptoms"],urgency:"low",urgencyNote:"Usually not urgent. Seek care if you have severe abdominal pain, vomiting, blood in the stool, weight loss, or you cannot pass stool or gas."},
  overactive_bladder:{name:"Overactive Bladder",cat:"Urinary / Functional",desc:"A condition marked by sudden urinary urgency, frequent trips to the bathroom, and sometimes leakage, without a clear infection.",symptoms:["Sudden, hard-to-defer urge to urinate","Frequent urination during the day","Waking at night to urinate (nocturia)","Sometimes leaking urine before reaching the bathroom","Small-volume urination many times a day","Symptoms triggered by running water, caffeine, or certain drinks"],treatments:["Bladder training and timed voiding","Pelvic floor exercises (Kegels)","Limiting bladder irritants like caffeine and alcohol","Managing fluid timing later in the evening","Prescription medications if conservative measures are not enough","Specialist evaluation if symptoms are severe or persistent"],urgency:"low",urgencyNote:"See a doctor if this is new, worsening, or disruptive. Get checked urgently if you also have pain, fever, blood in the urine, or trouble emptying your bladder."},
  fungal_infection:{name:"Fungal Skin Infection (Ringworm / Tinea)",cat:"Skin / Fungal",desc:"A superficial fungal infection of the skin that commonly causes itchy, scaly, ring-shaped or peeling patches.",symptoms:["Round or ring-shaped rash with a clearer center","Scaly, flaky, or peeling skin","Itching that may worsen with sweating","Often affects feet, groin, body folds, scalp, or nails","May spread slowly outward over time","Can be picked up from locker rooms, shared gear, pets, or close contact"],treatments:["Topical antifungal creams such as clotrimazole or terbinafine","Keep the area clean and dry","Change socks and underwear regularly","Avoid sharing towels, shoes, or sports gear","Treat athletes foot promptly to prevent spread","See a clinician if the scalp, nails, or large body areas are involved"],urgency:"low",urgencyNote:"Usually not urgent. See a doctor if the rash is widespread, involves the scalp or nails, keeps coming back, or you have diabetes or a weakened immune system."},
  tendonitis:{name:"Tendonitis / Overuse Injury",cat:"Musculoskeletal / Overuse",desc:"Inflammation or irritation of a tendon, often caused by repetitive motion, overtraining, or sudden increases in activity.",symptoms:["Pain near a joint with repeated use","Tenderness at the tendon attachment point","Pain with a specific motion such as lifting, gripping, or climbing stairs","Mild swelling or warmth","Stiffness after activity or in the morning","Symptoms often improve with rest and flare with overuse"],treatments:["Relative rest and temporary activity modification","Ice after aggravating activity","NSAIDs if appropriate","Gentle stretching and progressive strengthening","Bracing or taping for short-term support in some cases","Physical therapy for persistent or recurrent cases"],urgency:"low",urgencyNote:"Usually not urgent. Seek care if you cannot bear weight, cannot use the limb normally, heard a pop, or symptoms are not improving after a couple of weeks."},
  sleep_apnea:{name:"Obstructive Sleep Apnea (Risk Indicator)",cat:"Sleep / Breathing",desc:"A sleep-related breathing disorder in which the airway repeatedly narrows or closes during sleep, leading to poor-quality rest and daytime fatigue.",symptoms:["Loud habitual snoring","Witnessed pauses in breathing during sleep","Waking up gasping or choking","Unrefreshing sleep even after enough hours in bed","Daytime sleepiness or dozing off","Morning headaches","Trouble concentrating and irritability"],treatments:["Sleep study to confirm the diagnosis","CPAP therapy is the standard treatment","Weight management when applicable","Sleeping on your side instead of your back","Treat nasal obstruction or allergies","Oral appliances or specialist referral for selected patients"],urgency:"mod",urgencyNote:"See a doctor or sleep specialist for evaluation, especially if you are very sleepy during the day, have high blood pressure, or are told you stop breathing in your sleep."},
  dehydration:{name:"Dehydration",cat:"Fluid / General",desc:"A state where the body does not have enough fluid, often from heat, vomiting, diarrhea, fever, poor intake, or heavy exercise.",symptoms:["Thirst and dry mouth","Dark urine or peeing less often","Dizziness or lightheadedness","Fatigue, weakness, or headache","Rapid heartbeat","Dry skin or feeling overheated","Muscle cramps"],treatments:["Drink water and electrolyte-containing fluids","Oral rehydration solutions after vomiting or diarrhea","Rest and avoid overheating","Treat the underlying cause such as fever, stomach illness, or excessive sweating","IV fluids for severe dehydration","Monitor urine color and frequency as recovery signs"],urgency:"mod",urgencyNote:"Seek urgent care for confusion, fainting, inability to keep fluids down, very little urine, rapid breathing, or severe weakness. Young children and older adults can become dehydrated quickly."},
  hypothyroidism:{name:"Hypothyroidism",cat:"Endocrine / Thyroid",desc:"A condition where the thyroid gland does not produce enough thyroid hormone, often causing slow metabolism and chronic fatigue.",symptoms:["Persistent fatigue and low energy","Weight gain or difficulty losing weight","Cold intolerance","Dry skin or hair changes","Constipation","Puffy face or swelling","Slowed thinking or depressed mood"],treatments:["Blood tests such as TSH and free T4 to confirm the diagnosis","Daily thyroid hormone replacement (levothyroxine) if diagnosed","Regular lab monitoring to adjust the dose","Address contributing factors such as iodine deficiency or autoimmune thyroid disease","Follow-up with primary care or endocrinology"],urgency:"low",urgencyNote:"Usually not an emergency, but it should be evaluated with blood tests. See a doctor if symptoms are persistent or worsening, especially if combined with swelling, hoarseness, or significant fatigue."},
  ear_infection:{name:"Ear infection",cat:"Ear / ENT",desc:"Pain and fullness in the ear, either in the middle ear after a cold or in the ear canal after water exposure. A clinician has to look in the ear to tell which it is.",symptoms:["Ear pain or a blocked, full feeling","Muffled hearing on that side","Fever, especially in children after a cold","Drainage from the ear","Pain when the outer ear is tugged (more typical of the ear canal)","Recent cold, allergies, or swimming"],treatments:["Pain relief such as acetaminophen or ibuprofen, if those are safe for you","Have a clinician look in the ear before starting antibiotics","Antibiotic ear drops are sometimes used for an outer-ear infection","Keep a swimmer's ear dry while it heals","Warm compress held over the ear for comfort"],urgency:"mod",urgencyNote:"Get the ear examined if pain, fever, drainage, or hearing loss is new. Go urgently for swelling behind the ear, a stiff neck, severe headache, confusion, or dizziness with vomiting."},
  conjunctivitis:{name:"Pink eye (conjunctivitis)",cat:"Eye",desc:"Inflammation of the thin lining of the eyelid and the white of the eye. Viruses, bacteria, and allergies are the usual causes, and the eye looks pink.",symptoms:["Pink or red eye","Watery, sticky, or crusty discharge","Lashes stuck together after sleep","Itching, mostly when allergies are the cause","Often starts in one eye and may spread to the other","Vision stays basically normal"],treatments:["Wash hands often and don't share towels or pillowcases","Cool compress and preservative-free artificial tears for comfort","Antihistamine eye drops if the eyes are itchy and you also have hay fever","Antibiotic drops only if a clinician decides the cause is bacterial","Throw away mascara and replace contact lenses used during the infection"],urgency:"low",urgencyNote:"Get same-day care if vision drops, light hurts the eye, the eye is very painful, you wear contacts, or a newborn has a red eye. Simple pink eye without those features can often wait for a routine visit."},
  chest_wall:{name:"Chest wall pain",cat:"Chest / Musculoskeletal",desc:"Soreness in the chest wall, often where a rib meets the breastbone. The spot hurts when pressed, twisted, or during a deep breath. It is a common cause of chest pain that is not a heart attack.",symptoms:["A tender spot you can find with a finger","Pain worse with twisting, reaching, coughing, or a deep breath","Pain that stays in one small area","Often follows a strain, a bout of coughing, or an awkward posture","Not a crushing pressure that comes on with walking"],treatments:["Ease the movement that stirs it up for a few days","A warm compress or ice, whichever feels better","Acetaminophen or an anti-inflammatory if those are safe for you","Most cases settle over days to a couple of weeks","Get examined if it is not improving or you are unsure"],urgency:"low",urgencyNote:"Call 911 for crushing chest pain, pain into the arm or jaw, sweating, fainting, or shortness of breath. The opening question of this interview is there to catch that pattern. If you are unsure whether chest pain is muscular, get checked in person."}
