// STATE
// ═══════════════════════════════════════════════════
const SHARED_FLOW = new Set(['fever','dur','sev','RESULTS']);
const SHARED_FLOW_ORDER = {fever:0,dur:1,sev:2,RESULTS:3};

let state = {
  screen: 'quiz',
  history: [],
  scores: {},
  sectionQueue: [],
  sharedNext: null
};

let pendingOpt = null;
let pendingOpts = [];

function resetState(){
  state.screen = 'quiz';
  state.history.length = 0;
  for(const key of Object.keys(state.scores)) delete state.scores[key];
  state.sectionQueue.length = 0;
  state.sharedNext = null;
  pendingOpt = null;
  pendingOpts = [];
}

function addScores(s){
  for(const [k,v] of Object.entries(s)){
    state.scores[k] = (state.scores[k]||0)+v;
  }
}

function removeScores(s){
  for(const [k,v] of Object.entries(s)){
    state.scores[k] = (state.scores[k]||0)-v;
  }
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function getCurrentQuestionId(){
  const entry = state.history[state.history.length-1];
  return entry ? entry.next : 'redflag';
}

function updateStatusPill(){
  const label = document.querySelector('.status-text');
  if(!label) return;
  if(state.screen==='emergency'){
    label.textContent='Get care now';
  }else if(state.screen==='results'){
    label.textContent='Notes ready';
  }else if(state.history.length===0){
    label.textContent='Just opened';
  }else{
    label.textContent='Question '+(state.history.length+1);
  }
}

function getRemainingQuestionCount(qid, seen=new Set()){
  if(qid==='RESULTS' || qid==='EMERGENCY') return 0;
  if(!QUESTIONS[qid] || seen.has(qid)) return 0;

  const nextSeen = new Set(seen);
  nextSeen.add(qid);

  const nexts = [...new Set(QUESTIONS[qid].opts.map(opt=>opt.next))];
  const maxRemaining = nexts.reduce((max,next)=>{
    return Math.max(max,getRemainingQuestionCount(next,nextSeen));
  },0);

  return 1 + maxRemaining;
}

function isMultiSelectQuestion(qid){
  return Boolean(QUESTIONS[qid]?.multi);
}

function getSelectedIndexes(qid){
  return isMultiSelectQuestion(qid) ? [...pendingOpts] : (pendingOpt===null ? [] : [pendingOpt]);
}

function mergeScoresForIndexes(q,indexes){
  return indexes.reduce((scores,idx)=>{
    const optScores = q.opts[idx]?.s || {};
    Object.entries(optScores).forEach(([key,value])=>{
      scores[key] = (scores[key] || 0) + value;
    });
    return scores;
  },{});
}

function combineSharedNext(current,next){
  if(!SHARED_FLOW.has(next)) return current;
  if(!current) return next;
  return SHARED_FLOW_ORDER[next] < SHARED_FLOW_ORDER[current] ? next : current;
}

function getProgressTotal(qid){
  const queuedCount = state.sectionQueue.reduce((sum,next)=>sum + getRemainingQuestionCount(next),0);
  return Math.max(state.history.length + getRemainingQuestionCount(qid) + queuedCount,1);
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function getRankedMatches(limit=3){
  return Object.entries(state.scores)
    .filter(([key,value])=>CONDITIONS[key] && value>0)
    .sort(([,a],[,b])=>b-a)
    .slice(0,limit)
    .map(([id,score])=>({id,score,condition:CONDITIONS[id]}));
}

function getHistoryOptionTexts(entry){
  const q = QUESTIONS[entry.qid];
  const indexes = entry.optIdxs || (Number.isInteger(entry.optIdx) ? [entry.optIdx] : []);
  return indexes.map(idx=>q?.opts?.[idx]?.t).filter(Boolean);
}

function renderHistoryLabel(entry,idx){
  const labels = getHistoryOptionTexts(entry);
  if(!labels.length) return '';
  const text = labels.length > 1 ? labels.join(' + ') : labels[0];
  return `<div class="path-item">${idx+1}. ${escapeHtml(text)}</div>`;
}

function renderClinicalSidebar(pct,caption,showOnMobile){
  const matches = getRankedMatches(3);
  const maxScore = matches[0]?.score || 0;
  const matchCards = matches.length ? matches.map((item,idx)=>{
    const matchPct = maxScore ? Math.round((item.score/maxScore)*100) : 0;
    const c = item.condition;
    return `
    <div class="match-preview ${idx===0?'top':''}">
      <div class="match-head">
        <div class="match-name">${escapeHtml(c.name)}</div>
        <div class="match-value">${matchPct}%</div>
      </div>
      <div class="match-track"><div class="match-fill" style="width:${matchPct}%"></div></div>
    </div>`;
  }).join('') : `<div class="match-empty">Nothing to line up yet. Answer a couple of questions and the nearer conditions show up here.</div>`;
  const path = state.history.map(renderHistoryLabel).join('');
  const mobileClass = showOnMobile ? ' show-mobile' : '';

  return `
  <aside class="clinical-sidebar${mobileClass}">
    <section class="sidebar-block">
      <div class="side-label">Where you are</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p class="progress-caption">${escapeHtml(caption)}</p>
    </section>
    <section class="sidebar-block">
      <div class="side-label">Closer fits</div>
      <div class="match-list">${matchCards}</div>
    </section>
    ${path ? `<section class="sidebar-block"><div class="side-label">What you said</div><div class="path-list">${path}</div></section>` : ''}
  </aside>`;
}

function renderAppShell(mainHtml,pct,caption,showSidebarOnMobile){
  return `
  <div class="workspace">
    ${mainHtml}
    ${renderClinicalSidebar(pct,caption,showSidebarOnMobile)}
  </div>`;
}

function renderQuiz(){
  const qid = getCurrentQuestionId();
  const q = QUESTIONS[qid];
  const stepNum = state.history.length+1;
  const totalQuestions = getProgressTotal(qid);
  const pct = Math.min(Math.round((state.history.length/totalQuestions)*100),95);
  const multi = isMultiSelectQuestion(qid);
  const selectedCount = getSelectedIndexes(qid).length;
  const caption = state.history.length===0 ? 'This is the opening question.' : `About ${pct}% of the way through.`;
  const nextLabel = continueLabel(qid, selectedCount);

  const main = `
  <main class="console">
    <div class="console-head">
      <div class="kicker-row">
        <span class="kicker">Question ${stepNum}</span>
        <span class="kicker-of">of about ${totalQuestions}</span>
      </div>
      <h2 class="console-title">${escapeHtml(q.text)}</h2>
      ${q.sub?`<p class="console-copy">${escapeHtml(q.sub)}</p>`:''}
      <div class="progress-chip">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>
    <div class="choice-grid" id="opts">
      ${q.opts.map((o,i)=>{
        const selected = multi ? pendingOpts.includes(i) : pendingOpt===i;
        return `
        <button class="opt${selected?' selected':''}" aria-pressed="${selected?'true':'false'}" onclick="selectOpt(${i})" id="opt${i}" data-idx="${i}">
          <span class="opt-marker" aria-hidden="true">${i+1}</span>
          <span><strong>${escapeHtml(o.t)}</strong>${o.sub?`<small>${escapeHtml(o.sub)}</small>`:''}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="composer">
      <p class="key-hint">Keys 1–9 choose an answer. Enter continues.</p>
      <div class="composer-actions nav">
        <div class="action-left">
          <button class="btn-back" onclick="goBack()" ${state.history.length===0?'disabled':''}>Back</button>
          <button class="btn-secondary" onclick="restart()">Start over</button>
        </div>
        <div class="action-right">
          <button class="btn-next" id="btn-next" ${selectedCount===0?'disabled':''} onclick="advance()">${nextLabel}</button>
        </div>
      </div>
    </div>
  </main>`;
  return renderAppShell(main,pct,caption,false);
}

function continueLabel(qid, count){
  if(!isMultiSelectQuestion(qid)) return 'Continue';
  if(count===0) return 'Continue';
  if(count===1) return 'Continue with 1 area';
  return `Continue with ${count} areas`;
}

function selectOpt(i){
  const qid = getCurrentQuestionId();
  if(isMultiSelectQuestion(qid)){
    pendingOpts = pendingOpts.includes(i) ? pendingOpts.filter(idx=>idx!==i) : [...pendingOpts,i].sort((a,b)=>a-b);
  }else{
    pendingOpt = i;
    pendingOpts = [];
  }
  document.querySelectorAll('.opt').forEach((el,idx)=>{
    const selected = isMultiSelectQuestion(qid) ? pendingOpts.includes(idx) : pendingOpt===idx;
    el.classList.toggle('selected',selected);
    el.setAttribute('aria-pressed',selected ? 'true' : 'false');
  });
  const nb = document.getElementById('btn-next');
  if(nb){
    const count = getSelectedIndexes(qid).length;
    nb.disabled = count === 0;
    nb.textContent = continueLabel(qid, count);
  }
}

function scrollToQuestion(){
  if(!window.matchMedia('(max-width: 640px)').matches) return;
  requestAnimationFrame(()=>{
    const grid = document.querySelector('.choice-grid');
    if(grid) grid.scrollTop = 0;
  });
}

function advance(){
  const qid = getCurrentQuestionId();
  const q = QUESTIONS[qid];
  const selected = getSelectedIndexes(qid);
  if(!selected.length) return;

  const beforeQueue = [...state.sectionQueue];
  const beforeSharedNext = state.sharedNext;
  const rawScores = mergeScoresForIndexes(q,selected);
  const scores = {};
  for(const [k,v] of Object.entries(rawScores)){
    if(SHARED_FLOW.has(qid) && !(state.scores[k] > 0)) continue;
    scores[k] = v;
  }
  addScores(scores);

  let naturalNext = q.opts[selected[0]]?.next || 'RESULTS';
  let next = naturalNext;

  if(naturalNext === 'EMERGENCY'){
    state.screen = 'emergency';
    pendingOpt = null;
    pendingOpts = [];
    render();
    return;
  }

  if(qid === 'start'){
    const sections = selected.map(idx=>q.opts[idx]?.next).filter(Boolean);
    next = sections[0] || 'RESULTS';
    naturalNext = next;
    state.sectionQueue = sections.slice(1);
    state.sharedNext = null;
  }else if(SHARED_FLOW.has(qid)){
    state.sharedNext = null;
  }else if(SHARED_FLOW.has(naturalNext)){
    state.sharedNext = combineSharedNext(state.sharedNext,naturalNext);
    next = state.sectionQueue.length ? state.sectionQueue.shift() : state.sharedNext;
  }

  state.history.push({
    qid,
    optIdx:selected[0],
    optIdxs:selected,
    next,
    naturalNext,
    scores,
    beforeQueue,
    beforeSharedNext
  });
  pendingOpt = null;
  pendingOpts = [];
  if(next==='RESULTS'){
    state.screen='results';
  }
  render();
  scrollToQuestion();
}

function goBack(){
  if(state.history.length===0) return;
  const last = state.history.pop();
  removeScores(last.scores);
  state.sectionQueue = last.beforeQueue || [];
  state.sharedNext = last.beforeSharedNext || null;
  pendingOpt = Number.isInteger(last.optIdx) ? last.optIdx : null;
  pendingOpts = last.optIdxs ? [...last.optIdxs] : (pendingOpt===null ? [] : [pendingOpt]);
  state.screen='quiz';
  render();
  scrollToQuestion();
}

// ═══════════════════════════════════════════════════
// RESULTS
// ═══════════════════════════════════════════════════
function renderEmergency(){
  return `
  <div class="workspace">
    <main class="console">
      <div class="emergency-screen">
        <h2>This needs a person, not a form.</h2>
        <p>You marked a warning sign. Call <strong>911</strong> or go to the nearest emergency department. Do not wait on this interview.</p>
        <div class="emergency-actions">
          <button class="btn-primary" onclick="window.open('tel:911','_self')">Call 911</button>
          <button class="btn-secondary" onclick="restart()">Back to the start</button>
        </div>
        <button class="btn-link emergency-continue" onclick="continueAnyway()">Continue the interview anyway</button>
      </div>
    </main>
  </div>`;
}

function continueAnyway(){
  state.screen = 'quiz';
  state.history = [{
    qid:'redflag',
    optIdx:3,
    optIdxs:[3],
    next:'start',
    naturalNext:'start',
    scores:{},
    beforeQueue:[],
    beforeSharedNext:null
  }];
  pendingOpt = null;
  pendingOpts = [];
  render();
}

function getAnalysisSummary(){
  const matchCount = Object.values(state.scores).filter(v=>v>0).length;
  return {matchCount};
}

function renderResultsContent(){
  const ranked = Object.entries(state.scores)
    .filter(([,v])=>v>0)
    .sort(([,a],[,b])=>b-a)
    .slice(0,3);

  if(ranked.length===0){
    return `<div class="analysis-summary">
      <h3>No clear overlap</h3>
      <p>Nothing in the list lined up with what you described. A clinician can sort that out. This page cannot.</p>
      <button class="btn-restart" onclick="restart()">Start another interview</button>
    </div>`;
  }

  const maxScore = ranked[0][1];
  const hasEmergency = ranked.some(([k])=>CONDITIONS[k]&&CONDITIONS[k].urgency==='high');
  const summary = getAnalysisSummary();
  const ranks = ['Closest fit','Next','Also in the mix'];
  const rankClasses = ['r1','r2','r3'];

  let html = `
  <div class="analysis-summary">
    <h3>How to read this</h3>
    <p>You answered ${state.history.length} questions. ${summary.matchCount} conditions picked up some overlap. The bars compare those conditions with each other. They are not a probability and not a diagnosis.</p>
  </div>`;

  if(hasEmergency){
    html += `<div class="emergency-banner">One of these can be an emergency. If the symptoms are severe, get care now instead of reading on.</div>`;
  }

  ranked.forEach(([cid, score], idx)=>{
    const c = CONDITIONS[cid];
    if(!c) return;
    const pct = Math.round((score/maxScore)*100);
    const barClass = pct>=70?'mhigh':pct>=40?'mmed':'mlow';
    const urgClass = c.urgency==='high'?'u-high':c.urgency==='mod'?'u-mod':'u-low';
    const urgLabel = c.urgency==='high'?'Get care soon':c.urgency==='mod'?'See a doctor':'Usually not urgent';
    const confidence = pct>=75?'Strongest overlap here':pct>=45?'Partial overlap':'Weaker overlap';

    html += `
    <div class="res-card ${idx===0?'top':''}">
      <div class="res-card-header">
        <div>
          <div class="res-cat">${escapeHtml(c.cat)}</div>
          <div class="res-name">${escapeHtml(c.name)}</div>
        </div>
        <div class="res-score">
          <div class="rank-pill ${rankClasses[idx]}">${ranks[idx]}</div>
          <div class="match-pct">${pct}%</div>
          <div class="match-confidence">${confidence}</div>
        </div>
      </div>
      <div class="match-bar-wrap"><div class="match-bar-fill ${barClass}" style="width:${pct}%"></div></div>
      <div class="res-desc">${escapeHtml(c.desc)}</div>

      <div class="sec-label" onclick="toggleSection('sym${idx}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('sym${idx}')}" tabindex="0" role="button" aria-expanded="false" id="lbl-sym${idx}">
        <svg width="8" height="12" viewBox="0 0 8 12"><path d="M1 1l6 5-6 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        Common symptoms, ${c.symptoms.length}
      </div>
      <div class="list-panel" id="sym${idx}">
        <div class="list">${c.symptoms.map(s=>`<div class="list-item sym">${escapeHtml(s)}</div>`).join('')}</div>
      </div>

      <div class="sec-label" onclick="toggleSection('trt${idx}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('trt${idx}')}" tabindex="0" role="button" aria-expanded="false" id="lbl-trt${idx}">
        <svg width="8" height="12" viewBox="0 0 8 12"><path d="M1 1l6 5-6 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        Care options, ${c.treatments.length}
      </div>
      <div class="list-panel" id="trt${idx}">
        <div class="list">${c.treatments.map(t=>`<div class="list-item trt">${escapeHtml(t)}</div>`).join('')}</div>
      </div>

      <div>
        <div class="urgency ${urgClass}">${urgLabel}</div>
        <div class="u-note">${escapeHtml(c.urgencyNote)}</div>
      </div>
    </div>`;
  });

  html += `
  <div class="res-disclaimer">
    <strong>Still not a diagnosis.</strong> Qurest is educational. It does not replace a clinician. If you think this is an emergency, <strong>call 911</strong>.
  </div>
  <button class="btn-restart" onclick="restart()">Start another interview</button>`;

  return html;
}

function renderResults(){
  const main = `
  <main class="console">
    <div class="console-head">
      <div class="kicker-row"><span class="kicker">Your notes</span></div>
      <h2 class="console-title">The closer fits</h2>
      <p class="console-copy">From this interview only. Take them to a person who can actually examine you.</p>
    </div>
    <div class="results-main">${renderResultsContent()}</div>
  </main>`;
  return renderAppShell(main, 100, "That's the end of the interview.", true);
}

function toggleSection(id){
  const panel = document.getElementById(id);
  const lbl = document.getElementById('lbl-'+id);
  if(!panel) return;
  const isOpen = panel.classList.toggle('open');
  if(lbl){
    lbl.classList.toggle('open',isOpen);
    lbl.setAttribute('aria-expanded',isOpen?'true':'false');
  }
}

function bindKeyboardNav(){
  document.removeEventListener('keydown',handleKeyNav);
  if(state.screen==='quiz') document.addEventListener('keydown',handleKeyNav);
}

function handleKeyNav(e){
  if(state.screen!=='quiz') return;
  const qid = getCurrentQuestionId();
  const q = QUESTIONS[qid];
  if(!q) return;
  const opts = document.querySelectorAll('.opt');
  if(!opts.length) return;

  if(e.key>='1' && e.key<='9'){
    const idx = parseInt(e.key,10)-1;
    if(idx < q.opts.length){e.preventDefault();selectOpt(idx);}
    return;
  }
  if(e.key==='Enter'){
    const btn = document.getElementById('btn-next');
    if(btn && !btn.disabled){e.preventDefault();advance();}
    return;
  }
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault();
    const current = getSelectedIndexes(qid);
    let idx = current.length ? current[0] : -1;
    idx = e.key==='ArrowDown' ? Math.min(idx+1,q.opts.length-1) : Math.max(idx-1,0);
    selectOpt(idx);
    opts[idx]?.focus();
  }
}

function restart(){
  resetState();
  render();
}

function isMobileLayout(){
  return window.matchMedia('(max-width: 640px)').matches;
}

function pinMobileFooter(){
  const inApp = document.querySelector('#app .composer');
  const parked = document.getElementById('mobile-footer');
  const keepFooter = isMobileLayout() && state.screen === 'quiz';

  if(!keepFooter){
    if(parked && inApp && parked !== inApp) parked.remove();
    if(parked && !inApp){
      const host = document.querySelector('#app .console');
      if(host && state.screen === 'quiz'){
        parked.removeAttribute('id');
        parked.removeAttribute('role');
        parked.removeAttribute('aria-label');
        host.appendChild(parked);
      }else{
        parked.remove();
      }
    }
    return;
  }

  const composer = inApp || parked;
  if(!composer) return;
  if(parked && inApp && parked !== inApp) parked.remove();
  composer.id = 'mobile-footer';
  composer.setAttribute('role','navigation');
  composer.setAttribute('aria-label','Assessment navigation');
  if(composer.parentElement !== document.body) document.body.appendChild(composer);
}

function render(){
  document.body.dataset.screen = state.screen;
  const app = document.getElementById('app');
  if(state.screen==='emergency') app.innerHTML = renderEmergency();
  else if(state.screen==='quiz') app.innerHTML = renderQuiz();
  else app.innerHTML = renderResults();
  app.className = 'fade-in';
  updateStatusPill();
  bindKeyboardNav();
  pinMobileFooter();
  if(state.screen==='results'){
    setTimeout(()=>{
      ['sym0','trt0'].forEach(id=>{
        const p = document.getElementById(id);
        const l = document.getElementById('lbl-'+id);
        if(p){p.classList.add('open');if(l){l.classList.add('open');l.setAttribute('aria-expanded','true');}}
      });
    },50);
  }
}

render();
window.addEventListener('resize', pinMobileFooter);
</script>
